    <main>
        <div class="start">
            <form class="form">
            <h1>Расчет стоимость проживания</h1>
            <label>Номер</label>
        <div>
            <select id="room-type">                
                <!-- <option value="">выберите номер</option> -->

                <option value="собака комфорт">собака комфорт 1950₽/сутки</option>

        </div>

        </div>

            <button type="submit" class="ras">Забронировать</button>
